# The serving half of the pipeline: vLLM behind an authenticated gateway.
#
#   docker compose up --build
#
# Requires a merged checkpoint at ./artifacts/merged/current (make train merge,
# or point MERGED_MODEL_DIR elsewhere) and GPU passthrough for the vllm service.
#
# No NVIDIA GPU? Layer docker-compose.cpu.yml on top: same gateway, same API,
# vLLM's CPU backend instead of CUDA. See that file and configs/serve_cpu.yaml.
#
# On Linux that means the NVIDIA container toolkit. On Windows it means Docker
# Desktop with the WSL2 backend, which registers an `nvidia` runtime and passes
# the card through to Linux containers -- vLLM has no Windows wheel, but it does
# not need one to run here. Confirm your setup before bringing the stack up:
#
#   docker run --rm --gpus all nvidia/cuda:12.6.0-base-ubuntu22.04 nvidia-smi
#
# Nothing is exposed except the gateway. vLLM listens on the internal network
# only -- it has no authentication of its own, so publishing its port would
# hand the GPU to anyone who can reach the host.

services:
  vllm:
    build:
      context: .
      dockerfile: serving/vllm/Dockerfile
    image: dllm-vllm:0.1.0
    environment:
      MODEL_DIR: /models/current
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-domain-sql}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-2048}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.85}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-64}
      DTYPE: ${DTYPE:-bfloat16}
      HF_HOME: /root/.cache/huggingface
      # Required under Docker Desktop / WSL2, harmless elsewhere.
      #
      # vLLM disables pinned host memory on WSL2 by default. Its UVA probe is
      # just `is_pin_memory_available()`, so with pinning off UVA reports
      # unavailable, and the V2 GPU model runner -- which allocates UvaBuffers
      # -- dies at init with a bare "RuntimeError: UVA is not available" that
      # names neither WSL2 nor pinned memory.
      #
      # Setting this re-enables pinning and the stack starts normally. If your
      # WSL2 setup genuinely cannot pin host memory, fall back to the V1 model
      # runner instead, which does not use UvaBuffer:
      #   VLLM_USE_V2_MODEL_RUNNER: "0"
      VLLM_WSL2_ENABLE_PIN_MEMORY: ${VLLM_WSL2_ENABLE_PIN_MEMORY:-1}
    volumes:
      - ${MERGED_MODEL_DIR:-./artifacts/merged/current}:/models/current:ro
      - hf-cache:/root/.cache/huggingface
    expose:
      - "8000"
    ipc: host          # vLLM needs a large /dev/shm for its workers
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 20
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: serving/gateway/Dockerfile
    image: dllm-gateway:0.1.0
    environment:
      # JSON list of {key_id, key_hash, tier}. Mint with `dllm serve keys`.
      # The gateway refuses every request if this is unset -- it never runs open.
      DLLM_GATEWAY_KEYS: ${DLLM_GATEWAY_KEYS:-}
      DLLM_REPO_ROOT: /app
    command:
      - python
      - -m
      - dllm.cli
      - serve
      - gateway
      - --config
      - configs/base.yaml
      - --set
      - serve.gateway.upstream_base_url=http://vllm:8000/v1
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf-cache:
