name: train

# Launch a LoRA fine-tune on a GPU runner.
#
# This needs a self-hosted runner with a CUDA device: GitHub's hosted runners
# have no GPU, and there is no point pretending otherwise by running on CPU and
# reporting a number nobody should trust. Label your runner `gpu`.
#
# A consumer card is enough. The reference 1.5B config was trained on an RTX
# 4060 (8 GB) in 1.15 hours at 4.83 GB peak VRAM, so "self-hosted GPU runner"
# here means a desktop, not a datacentre.
#
# Setting one up (repo must be private -- a self-hosted runner on a public repo
# will execute code from fork pull requests):
#   Settings -> Actions -> Runners -> New self-hosted runner
#   ./config.cmd --labels gpu --ephemeral
#   ./run.cmd
# `--ephemeral` makes the runner accept one job and exit, so nothing is left
# listening afterwards.
#
# WINDOWS RUNNERS: put Git Bash ahead of System32 on the runner's PATH before
# starting it:
#
#   $env:PATH = "C:\Program Files\Git\bin;C:\Program Files\Git\usr\bin;$env:PATH"
#   ./run.cmd
#
# `shell: bash` resolves whatever `bash` is first on PATH. If WSL is installed,
# that is C:\Windows\System32\bash.exe -- WSL's bash, which cannot read the
# Windows path of the script the runner generates. The failure is opaque:
#
#   /bin/bash: C:Usersuseractions-runner_work_temp<guid>.sh: No such file
#
# The backslashes have been eaten as escapes. It is not a missing file and not
# a permissions problem; it is the wrong bash.
#
# Re-running resumes rather than restarting: the checkpoint directory is cached
# and `train.resume: auto` picks up the newest checkpoint.

on:
  workflow_dispatch:
    inputs:
      config:
        description: Pipeline config to train with.
        required: true
        type: choice
        options:
          - configs/base.yaml
          - configs/local_4060_8gb.yaml
          - configs/rented_a100.yaml
        default: configs/base.yaml
      max_steps:
        description: Cap training steps (-1 for the full run; use ~20 to calibrate).
        required: false
        type: string
        default: "-1"
      run_name:
        description: Run name; also the checkpoint directory and cache key.
        required: false
        type: string
        default: sql-lora-ci

permissions:
  contents: read

jobs:
  train:
    name: LoRA fine-tune
    runs-on: [self-hosted, gpu]
    timeout-minutes: 720
    outputs:
      run_name: ${{ inputs.run_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Report the hardware we actually got
        shell: bash
        run: |
          nvidia-smi
          echo "runner OS: ${RUNNER_OS}"

      # Best effort, not a requirement. Provisioning the interpreter is the
      # right default -- a desktop's PATH is whatever accumulated over time, and
      # this one offered the Microsoft Store stub as `python3` (exists, refuses
      # to run) and Python 3.9 as `python` (runs, too old for this project).
      #
      # But setup-python writes to HKLM and therefore needs administrator
      # rights, which a self-hosted runner should not have. On a non-admin
      # Windows runner it fails with "Requested registry access is not allowed".
      # So: try it, and fall back to whatever the operator put on the runner's
      # PATH. scripts/setup.sh validates the version either way and refuses to
      # build a venv on anything below 3.10, so the fallback cannot silently
      # produce a broken environment.
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"

      - name: Install
        shell: bash
        run: bash scripts/setup.sh

      # A virtualenv puts the interpreter in Scripts/ on Windows and bin/ on
      # Linux. Hardcoding either makes this workflow single-platform, and the
      # GPU runner is as likely to be a Windows desktop as a Linux box.
      - name: Locate the interpreter
        id: py
        shell: bash
        run: |
          if [ -x ".venv/Scripts/python.exe" ]; then
            echo "bin=.venv/Scripts/python.exe" >> "$GITHUB_OUTPUT"
          elif [ -x ".venv/bin/python" ]; then
            echo "bin=.venv/bin/python" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no interpreter found in .venv after setup"
            exit 1
          fi

      - name: Confirm CUDA is actually visible to torch
        shell: bash
        run: |
          ${{ steps.py.outputs.bin }} - <<'PY'
          import sys, torch
          if not torch.cuda.is_available():
              sys.exit("::error::torch cannot see a CUDA device on this runner")
          print(torch.__version__, torch.cuda.get_device_name(0),
                "bf16=", torch.cuda.is_bf16_supported())
          PY

      - name: Licence audit
        shell: bash
        run: ${{ steps.py.outputs.bin }} -m dllm.cli data audit --config "${{ inputs.config }}"

      - name: Prepare data
        shell: bash
        run: ${{ steps.py.outputs.bin }} -m dllm.cli data prepare --config "${{ inputs.config }}"

      # Restore any checkpoint from a previous attempt so a re-run resumes.
      # restore-keys means a partial match still restores, which is the point:
      # the exact key only exists once a run has finished.
      - name: Restore checkpoints
        uses: actions/cache@v4
        with:
          path: artifacts/checkpoints/${{ inputs.run_name }}
          key: ckpt-${{ inputs.run_name }}-${{ github.sha }}
          restore-keys: |
            ckpt-${{ inputs.run_name }}-

      - name: Estimate before committing the hours
        shell: bash
        run: ${{ steps.py.outputs.bin }} -m dllm.cli train estimate --config "${{ inputs.config }}"

      # The baseline must exist before training, not after. Without a
      # before-number the after-number is not a result, and the gate refuses to
      # promote without one anyway.
      - name: Baseline eval (only if not already committed)
        shell: bash
        run: |
          if [ -f evals/results/baseline.json ]; then
            echo "baseline scorecard is committed; not re-running it"
          else
            ${{ steps.py.outputs.bin }} -m dllm.cli eval run \
              --config "${{ inputs.config }}" --label baseline
          fi

      - name: Train
        shell: bash
        run: |
          ${{ steps.py.outputs.bin }} -m dllm.cli train run \
            --config "${{ inputs.config }}" \
            --set train.run_name="${{ inputs.run_name }}" \
            --set train.max_steps="${{ inputs.max_steps }}"

      - name: Merge adapter
        shell: bash
        run: |
          ${{ steps.py.outputs.bin }} -m dllm.cli model merge \
            --config "${{ inputs.config }}" \
            --set train.run_name="${{ inputs.run_name }}" \
            --out artifacts/merged/ci

      - name: Evaluate the fine-tuned model
        shell: bash
        run: |
          ${{ steps.py.outputs.bin }} -m dllm.cli eval run \
            --config "${{ inputs.config }}" \
            --label finetuned-ci \
            --model-path artifacts/merged/ci

      - name: Scorecard comparison
        shell: bash
        run: |
          ${{ steps.py.outputs.bin }} -m dllm.cli eval compare \
            --baseline evals/results/baseline.json \
            --candidate evals/results/finetuned-ci.json \
            --out results_ci.md
          cat results_ci.md >> "$GITHUB_STEP_SUMMARY"

      # The gate job runs on a hosted runner and gets the scorecards from here.
      # Without this upload it would gate whatever is committed -- i.e. the
      # previous model, not the one just trained.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecards-${{ inputs.run_name }}
          path: |
            evals/results/baseline.json
            evals/results/finetuned-ci.json
            results_ci.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: train-telemetry-${{ inputs.run_name }}
          path: |
            artifacts/checkpoints/${{ inputs.run_name }}/train_summary.json
            artifacts/checkpoints/${{ inputs.run_name }}/heartbeat.json

      # Small and the actual output of the run. The merged checkpoint is ~3 GB
      # and regenerable from this in minutes, so it is deliberately not uploaded.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: adapter-${{ inputs.run_name }}
          path: artifacts/checkpoints/${{ inputs.run_name }}/adapter

  # Apply the gate to what the training job actually produced. This deploys
  # nothing -- it reports whether the result would be deployable, so a failed
  # fine-tune is visible here rather than at deploy time.
  gate:
    needs: train
    uses: ./.github/workflows/eval-gate.yml
    with:
      candidate: evals/results/finetuned-ci.json
      baseline: evals/results/baseline.json
      config: configs/base.yaml
      scorecard_artifact: scorecards-${{ needs.train.outputs.run_name }}
