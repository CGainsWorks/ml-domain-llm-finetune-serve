name: deploy

# A model reaches production only through this workflow, and this workflow
# cannot get past the `gate` job. `needs: gate` plus an explicit check on its
# output means there is no ordering, no `continue-on-error` and no manual
# override that lets an unevaluated model through.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate scorecard to gate on.
        required: true
        type: string
        default: evals/results/finetuned.json
      environment:
        description: Deployment environment.
        required: true
        type: choice
        options: [staging, production]
        default: staging
  push:
    tags:
      - "model-v*"

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------- #
  # 1. The gate. Everything downstream depends on this succeeding.
  # ---------------------------------------------------------------- #
  gate:
    uses: ./.github/workflows/eval-gate.yml
    with:
      candidate: ${{ inputs.candidate || 'evals/results/finetuned.json' }}
      baseline: evals/results/baseline.json
      config: configs/base.yaml

  # ---------------------------------------------------------------- #
  # 2. Belt and braces. `needs: gate` already blocks on failure; this
  #    also fails if the gate somehow reported success without promoting.
  # ---------------------------------------------------------------- #
  verify-gate:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to continue unless the gate promoted
        run: |
          if [ "${{ needs.gate.outputs.promote }}" != "true" ]; then
            echo "::error::eval gate did not promote this model. Deployment stops here."
            exit 1
          fi
          echo "Gate passed. Proceeding."

  # ---------------------------------------------------------------- #
  # 3. Build and publish. Only reachable through the two jobs above.
  # ---------------------------------------------------------------- #
  build-and-push:
    needs: [gate, verify-gate]
    if: needs.gate.outputs.promote == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/gateway
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push the gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: serving/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record what was deployed
        run: |
          {
            echo "### Deployed to ${{ inputs.environment || 'staging' }}"
            echo ""
            echo "- Gate: **passed**"
            echo "- Candidate: \`${{ inputs.candidate || 'evals/results/finetuned.json' }}\`"
            echo "- Images:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- #
  # 4. Make a blocked deploy loud rather than a silently skipped job.
  # ---------------------------------------------------------------- #
  report-blocked:
    needs: [gate]
    if: always() && needs.gate.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Explain the block
        run: |
          {
            echo "### Deployment BLOCKED"
            echo ""
            echo "The evaluation gate did not pass, so nothing was built or published."
            echo "Download the \`gate-report\` artifact from the gate job for the failing checks."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
