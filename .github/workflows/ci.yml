name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint-and-test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # base + serve + dev. Still no torch and no CUDA, so this job stays fast:
      # the eval harness, the scoring maths and the promotion gate are pure
      # Python. serve.txt is needed because the gateway tests import fastapi,
      # and it pulls in nothing heavy.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/serve.txt -r requirements/dev.txt
          pip install -e . --no-deps

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Unit tests
        run: pytest tests -q --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python }}
          path: test-results.xml

  licence-audit:
    name: licence audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements/base.txt
          pip install -e . --no-deps

      # Blocks the build on a non-commercial or undeclared dataset licence.
      # Downloads nothing: it reads the declared registry metadata.
      - name: Audit dataset licences
        run: python -m dllm.cli data audit --config configs/base.yaml

      - name: Fail if the audit report is stale
        run: |
          if ! git diff --quiet -- docs/LICENCE_AUDIT.md; then
            echo "::error::docs/LICENCE_AUDIT.md is out of date. Run 'make audit' and commit."
            git diff -- docs/LICENCE_AUDIT.md
            exit 1
          fi

  smoke:
    name: end-to-end smoke (CPU)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -r requirements/train.txt -r requirements/serve.txt -r requirements/dev.txt
          pip install -e . --no-deps

      # Cache the Hugging Face downloads. Without this every push re-fetches the
      # dataset and the tiny test model, and Hugging Face rate-limits shared CI
      # egress: a run failed with HTTP 429 on the dataset, which is an external
      # flake but one we were causing by asking for the same files every time.
      # Keyed on the pinned revisions, so a source change invalidates it.
      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('src/dllm/data/sources.py', 'configs/smoke.yaml') }}
          restore-keys: |
            hf-${{ runner.os }}-

      # audit -> prepare -> baseline -> train -> merge -> eval -> gate,
      # with a tiny random-weight model. Proves the stages connect, and
      # asserts that the gate BLOCKS the resulting garbage model.
      - name: Run the pipeline end to end
        run: bash scripts/run_smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-artifacts
          path: |
            evals/results/smoke-*.json
            artifacts/smoke_results.md
            artifacts/smoke_gate.md

  docker:
    name: build images + CPU serving smoke
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The CUDA vLLM image is a 10+ GB base that a standard runner cannot pull
      # inside the time limit; it is built in the deploy workflow on a GPU
      # runner. The CPU profile's vLLM image is built and run below.
      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: serving/gateway/Dockerfile
          push: false
          load: true
          tags: dllm-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gateway starts and refuses unauthenticated requests
        run: |
          docker run -d --name gw -p 8080:8080 dllm-gateway:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 2
          done
          curl -fsS http://localhost:8080/healthz

          # No keys configured -> must refuse, not serve.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"domain-sql","messages":[{"role":"user","content":"hi"}]}')
          echo "unauthenticated request returned $code"
          if [ "$code" = "200" ]; then
            echo "::error::gateway served an unauthenticated request"
            docker logs gw
            exit 1
          fi
          docker rm -f gw

      # CPU serving profile, end to end, on a runner with no GPU: the real
      # compose files with docker-compose.cpu.yml layered on, vLLM v0.26.0 on
      # its CPU backend, the gateway in front. The model is a STAND-IN,
      # HuggingFaceTB/SmolLM2-135M-Instruct (Apache-2.0, revision pinned),
      # because the fine-tuned weights are not published. This proves the
      # serving path (engine, API, auth, rate limit, token accounting), not
      # the model's SQL.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the stand-in model
        uses: actions/cache@v4
        with:
          path: artifacts/ci-standin
          key: standin-smollm2-135m-instruct-12fd25f77366fa6b3b4b768ec3050bf629380bac

      - name: Fetch the stand-in model
        run: |
          if [ -f artifacts/ci-standin/smollm2-135m-instruct/config.json ]; then
            echo "stand-in model restored from cache"
            exit 0
          fi
          pip install huggingface-hub==1.26.0
          python -c "
          from huggingface_hub import snapshot_download
          snapshot_download(
              'HuggingFaceTB/SmolLM2-135M-Instruct',
              revision='12fd25f77366fa6b3b4b768ec3050bf629380bac',
              local_dir='artifacts/ci-standin/smollm2-135m-instruct',
              allow_patterns=['*.json', '*.safetensors', 'merges.txt', 'vocab.json'],
          )"

      - name: CPU serving smoke (vLLM CPU backend + gateway, stand-in model)
        env:
          MERGED_MODEL_DIR: ./artifacts/ci-standin/smollm2-135m-instruct
        run: bash scripts/cpu_serving_smoke.sh

  validate-configs:
    name: configs and task definitions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install -e . --no-deps

      # Catches a typo'd YAML key now rather than 40 minutes into a rented hour.
      - name: Every shipped config validates
        run: pytest tests/test_config.py tests/test_tasks_and_scorecard.py -q
