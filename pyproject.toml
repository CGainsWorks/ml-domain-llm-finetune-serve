[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dllm"
version = "0.1.0"
description = "Domain-adapted LLM: dataset audit, LoRA fine-tune, eval-gated promotion, vLLM serving."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "CGainsWorks" }]

# Only what the *core* pipeline needs: config loading, data prep, the eval
# harness and the scoring maths. Deliberately excludes torch/vllm so that the
# eval harness and its unit tests run on a CPU-only CI box in seconds.
dependencies = [
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyYAML==6.0.3",
  "sqlglot==30.15.0",
  "numpy==2.2.6",
  "rich==14.2.0",
  "typer==0.20.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
train = [
  "transformers==5.14.1",
  "peft==0.20.0",
  "trl==1.9.2",
  "datasets==5.0.1",
  "accelerate==1.14.0",
  "mlflow==3.15.1",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "bitsandbytes==0.50.0; platform_system != 'Darwin'",
]
serve = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "openai==2.53.0",
  "prometheus-client==0.24.1",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "ruff==0.16.1",
]

[project.scripts]
dllm = "dllm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dllm = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# BLE (blind except) is enabled deliberately. This codebase has several places
# where catching Exception is the correct behaviour -- an eval harness must not
# die on one bad model output -- and each is marked with an explicit `noqa: BLE001`
# and a reason. Enabling the rule keeps those markers meaningful instead of dead.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "BLE"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "gpu: requires a CUDA device",
  "slow: takes more than a few seconds",
  "network: needs to reach the Hugging Face Hub",
]
asyncio_mode = "auto"
